name: Validate with hassfest
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"
